<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>General Championship | IIT Palakkad</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { background: #f4f6f8; font-family: 'Poppins', sans-serif; }
    
    .hero-gc {
      background: linear-gradient(135deg, #1a0a00 0%, #2d1200 40%, #1a0800 100%);
      padding: 80px 20px; text-align: center; color: #fff; position: relative; overflow: hidden;
    }
    .hero-gc::before {
      content: ''; position: absolute; inset: 0; background: url('https://www.transparenttextures.com/patterns/cubes.png'); opacity: 0.1;
    }
    .hero-gc h1 { font-size: 3.5rem; font-weight: 700; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
    .hero-gc h1 span { background: linear-gradient(120deg, #ff3a22, #c7af6b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero-gc p { font-size: 1.1rem; color: rgba(255,255,255,0.7); max-width: 600px; margin: 0 auto; }

    .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }

    /* Tabs */
    .tabs { display: flex; justify-content: center; gap: 20px; margin-bottom: 40px; }
    .tab-btn {
      padding: 12px 30px; font-size: 1.1rem; font-weight: 600; font-family: 'Poppins';
      background: #fff; border: 2px solid #e8e8e8; border-radius: 30px; cursor: pointer;
      color: #555; transition: 0.3s;
    }
    .tab-btn.active { background: linear-gradient(120deg, #ff3a22, #c7af6b); color: #fff; border-color: transparent; box-shadow: 0 5px 15px rgba(255,58,34,0.3); }
    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Sports Grid */
    .sports-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
    .sport-card {
      background: #fff; border-radius: 16px; padding: 25px; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #f0f0f0; transition: 0.3s;
    }
    .sport-card:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0,0,0,0.1); border-color: #c7af6b; }
    .sport-icon { font-size: 4rem; margin-bottom: 15px; }
    .sport-name { font-size: 1.5rem; font-weight: 700; color: #1a1a1a; margin-bottom: 10px; }
    .sport-meta { font-size: 0.85rem; color: #666; margin-bottom: 20px; display: flex; flex-direction: column; gap: 5px; }
    .btn-register {
      width: 100%; padding: 12px; border: none; border-radius: 10px; background: linear-gradient(120deg, #ff3a22, #c7af6b);
      color: #fff; font-family: 'Poppins'; font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.3s;
    }
    .btn-register:hover { box-shadow: 0 4px 15px rgba(255,58,34,0.3); }
    .btn-register:disabled { background: #eee; color: #aaa; cursor: not-allowed; box-shadow: none; }

    /* Leaderboard */
    .leaderboard-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    .leaderboard-table th { background: linear-gradient(120deg, #1a0a00, #2d1200); color: #fff; padding: 15px 20px; text-align: left; font-weight: 600; text-transform: uppercase; font-size: 0.9rem; letter-spacing: 1px; }
    .leaderboard-table td { padding: 15px 20px; border-bottom: 1px solid #eee; font-weight: 500; color: #333; }
    .leaderboard-table tr:last-child td { border-bottom: none; }
    .rank-col { width: 80px; text-align: center; font-size: 1.2rem; font-weight: 700; color: #a4893d; }
    
    .team-row { transition: 0.2s; }
    .team-row:hover { background: #faf9f7; }

    .rank-1 .rank-col { color: #FFD700; font-size: 1.5rem; }
    .rank-2 .rank-col { color: #C0C0C0; font-size: 1.4rem; }
    .rank-3 .rank-col { color: #CD7F32; font-size: 1.3rem; }

    /* Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
      z-index: 1000; opacity: 0; visibility: hidden; transition: 0.3s;
    }
    .modal-overlay.open { opacity: 1; visibility: visible; }
    .modal-content {
      background: #fff; padding: 30px; border-radius: 16px; width: 90%; max-width: 400px;
      transform: translateY(20px); transition: 0.3s;
    }
    .modal-overlay.open .modal-content { transform: translateY(0); }
    .modal-close { float: right; cursor: pointer; font-size: 1.5rem; color: #888; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">IIT Palakkad Dashboard</div>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="gc.html" class="active">GC 2026</a></li>
      <li><a href="events.html">Events</a></li>
      <li><a href="calendar.html">Calendar</a></li>
    </ul>
  </nav>

  <header class="hero-gc">
    <h1>General <span>Championship</span></h1>
    <p>The ultimate battle of the houses. Select your sport, represent your team, and fight for glory.</p>
  </header>

  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('sports')">Sports & Registration</button>
      <button class="tab-btn" onclick="switchTab('leaderboard')">Leaderboard</button>
    </div>

    <!-- Sports Tab -->
    <div id="sportsTab" class="tab-content active">
      <div id="alertBox" style="padding: 15px; margin-bottom: 20px; border-radius: 8px; display: none;"></div>
      <div class="sports-grid" id="sportsGrid">
        <div style="text-align: center; grid-column: 1/-1; padding: 40px; color: #888;">Loading sports...</div>
      </div>
    </div>

    <!-- Leaderboard Tab -->
    <div id="leaderboardTab" class="tab-content">
      <div style="overflow-x: auto;">
        <table class="leaderboard-table" id="leaderboardTable">
          <thead id="leaderboardHead">
            <tr>
              <th class="rank-col">Rank</th>
              <th>Team (House)</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="leaderboardBody">
            <tr><td colspan="3" style="text-align: center; padding: 40px; color: #888;">Loading leaderboard...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <!-- Team Selection Modal -->
    <div class="modal-overlay" id="teamModal">
      <div class="modal-content">
        <span class="modal-close" onclick="closeTeamModal()">&times;</span>
        <h3 style="margin-bottom: 10px; color: #a4893d;">Select Your Team</h3>
        <p style="font-size: 0.9rem; color: #666; margin-bottom: 20px;">You are registering for <strong id="modalSportName"></strong>.</p>
        
        <div style="margin-bottom: 20px;">
          <label style="display:block; font-size:0.9rem; margin-bottom: 8px;">Select Team (House) *</label>
          <select id="gcTeamSelect" required style="width: 100%; padding: 12px; border: 2px solid #e8e8e8; border-radius: 10px; font-size: 1rem; font-family: 'Poppins', sans-serif;">
            <option value="Wild Wolves">Wild Wolves 🐺</option>
            <option value="Mighty Lions">Mighty Lions 🦁</option>
            <option value="Stalwart Rhinos">Stalwart Rhinos 🦏</option>
            <option value="Majestic Eagles">Majestic Eagles 🦅</option>
            <option value="Ferocious Tigers">Ferocious Tigers 🐅</option>
            <option value="Stealthy Panthers">Stealthy Panthers 🐆</option>
            <option value="Savage Sharks">Savage Sharks 🦈</option>
          </select>
        </div>
        <button class="btn-register" onclick="submitGcRegistration()">Confirm Registration</button>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    let activeGcEvent = null;
    let selectedSportForReg = null;

    document.addEventListener('DOMContentLoaded', async () => {
      displayUserInfo();
      await fetchGC();
    });

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById(tabId + 'Tab').classList.add('active');
    }

    const sportIcons = {
      'Athletics': '🏃',
      'Badminton (Men)': '🏸',
      'Badminton (Women)': '🏸',
      'Basketball (Men)': '🏀',
      'Basketball (Women)': '🏀',
      'Cricket': '🏏',
      'Football': '⚽',
      'Table Tennis (Men)': '🏓',
      'Table Tennis (Women)': '🏓',
      'Volleyball (Men)': '🏐',
      'Volleyball (Women)': '🏐',
      'Powerlifting': '🏋️',
      'Chess': '♟️',
      'March Past': '🥁',
      'Penalties': '⚠️'
    };

    function showAlert(msg, isError) {
      const box = document.getElementById('alertBox');
      box.style.display = 'block';
      box.style.background = isError ? '#ffebee' : '#e8f5e9';
      box.style.color = isError ? '#c62828' : '#2e7d32';
      box.textContent = msg;
      setTimeout(() => box.style.display = 'none', 4000);
    }

    async function fetchGC() {
      try {
        const data = await apiRequest('/gc');
        activeGcEvent = data.event;
        renderSports();
        renderLeaderboard();
      } catch (err) {
        document.getElementById('sportsGrid').innerHTML = `<div style="text-align:center;grid-column:1/-1;color:red;">Error: ${err.message}</div>`;
      }
    }

    function renderSports() {
      const grid = document.getElementById('sportsGrid');
      if (!activeGcEvent || !activeGcEvent.sports.length) {
        grid.innerHTML = '<div style="text-align:center;grid-column:1/-1;">No active sports found.</div>';
        return;
      }

      grid.innerHTML = activeGcEvent.sports.map(sport => {
        const icon = sportIcons[sport.name] || '🏆';
        const dateStr = sport.date ? new Date(sport.date).toLocaleDateString() : 'TBA';
        const isClosed = sport.status === 'closed';

        // Extract Top 3 Leaderboard for this specific sport
        const sportScores = activeGcEvent.leaderboard
          .filter(entry => entry.sport === sport.name && entry.points > 0)
          .sort((a, b) => b.points - a.points)
          .slice(0, 3);

        let miniLeaderboardHtml = '';
        if (sportScores.length > 0) {
          const medals = ['🥇', '🥈', '🥉'];
          miniLeaderboardHtml = `
            <div style="margin: 15px 0 20px; padding-top: 15px; border-top: 1px solid #f0f0f0; text-align: left; font-size: 0.85rem; color: #555;">
              <strong style="display:block; margin-bottom:8px; color: #a4893d;">Top Teams:</strong>
              ${sportScores.map((score, idx) => `
                <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                  <span>${medals[idx] || ''} ${score.team}</span>
                  <strong>${score.points} pts</strong>
                </div>
              `).join('')}
            </div>
          `;
        } else {
          miniLeaderboardHtml = `
            <div style="margin: 15px 0 20px; padding-top: 15px; border-top: 1px solid #f0f0f0; font-size: 0.85rem; color: #aaa;">
              No results published yet
            </div>
          `;
        }

        return `
          <div class="sport-card" style="display: flex; flex-direction: column;">
            <div class="sport-icon">${icon}</div>
            <div class="sport-name">${sport.name}</div>
            <div class="sport-meta" style="flex-grow: 1;">
              <span>📅 ${dateStr} at ${sport.time || 'TBA'}</span>
              <span>📍 ${sport.venue || 'TBA'}</span>
              <span>👥 Max Players: ${sport.maxPlayers}</span>
            </div>
            ${miniLeaderboardHtml}
            <button class="btn-register" ${isClosed ? 'disabled' : ''} 
              onclick="openTeamModal('${sport.name}')" style="margin-top: auto;">
              ${isClosed ? 'Registration Closed' : 'Register Now'}
            </button>
          </div>
        `;
      }).join('');
    }

    function openTeamModal(sportName) {
      if (!isLoggedIn()) {
        window.location.href = 'login.html';
        return;
      }
      selectedSportForReg = sportName;
      document.getElementById('modalSportName').textContent = sportName;
      document.getElementById('teamModal').classList.add('open');
    }

    function closeTeamModal() {
      document.getElementById('teamModal').classList.remove('open');
      selectedSportForReg = null;
    }

    async function submitGcRegistration() {
      if (!selectedSportForReg) return;
      const team = document.getElementById('gcTeamSelect').value;
      
      try {
        const res = await apiRequest(`/gc/register/${activeGcEvent._id}`, 'POST', { sportName: selectedSportForReg, team });
        closeTeamModal();
        showAlert(res.message, false);
      } catch (err) {
        closeTeamModal();
        showAlert(err.message, true);
      }
    }

    function renderLeaderboard() {
      const thead = document.getElementById('leaderboardHead');
      const tbody = document.getElementById('leaderboardBody');
      
      if (!activeGcEvent || !activeGcEvent.leaderboard.length) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align: center;">No points awarded yet.</td></tr>';
        return;
      }

      // Extract unique sports from leaderboard data or from activeGcEvent.sports
      // Best to use activeGcEvent.sports to show all sports even if no points are awarded
      const allSports = activeGcEvent.sports.map(s => s.name);
      // Let's add Penalties if it exists in leaderboard but not in sports array (though we added it to sports array)
      const sportSet = new Set(allSports);
      activeGcEvent.leaderboard.forEach(entry => sportSet.add(entry.sport));
      const sportsList = Array.from(sportSet);

      // Build dynamic header
      let theadHtml = `
        <tr>
          <th class="rank-col">Rank</th>
          <th>Team (House)</th>
          <th>Total</th>
          ${sportsList.map(sport => `<th style="text-align:center; font-size:0.8rem; min-width:80px;">${sport}</th>`).join('')}
        </tr>
      `;
      thead.innerHTML = theadHtml;

      // Aggregate points per team and per sport
      const teamData = {};
      activeGcEvent.leaderboard.forEach(entry => {
        if (!teamData[entry.team]) {
          teamData[entry.team] = { total: 0, sports: {} };
        }
        teamData[entry.team].total += entry.points;
        teamData[entry.team].sports[entry.sport] = entry.points;
      });

      // Sort teams by total points descending
      const sortedTeams = Object.keys(teamData).map(t => ({ 
        team: t, 
        total: teamData[t].total,
        sports: teamData[t].sports
      })).sort((a, b) => b.total - a.total);

      tbody.innerHTML = sortedTeams.map((t, index) => {
        const rank = index + 1;
        let rankHtml = rank;
        if (rank === 1) rankHtml = '🥇 1';
        if (rank === 2) rankHtml = '🥈 2';
        if (rank === 3) rankHtml = '🥉 3';

        const sportsCols = sportsList.map(sport => {
          const pts = t.sports[sport];
          const displayPts = pts !== undefined ? pts : '-';
          return `<td style="text-align:center;">${displayPts}</td>`;
        }).join('');

        return `
          <tr class="team-row rank-${rank}">
            <td class="rank-col">${rankHtml}</td>
            <td style="white-space: nowrap;"><strong>${t.team}</strong></td>
            <td style="font-weight:700; color:#a4893d; font-size:1.1rem;">${t.total}</td>
            ${sportsCols}
          </tr>
        `;
      }).join('');
    }
  </script>
</body>
</html>
