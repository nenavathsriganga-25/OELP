<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Calendar | IIT Palakkad</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { background: #f9f9f9; font-family: 'Poppins', sans-serif; }
    .calendar-container { max-width: 1000px; margin: 40px auto; background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); overflow: hidden; padding: 20px; }
    .calendar-header { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 2px solid #f0f0f0; margin-bottom: 20px; }
    .calendar-header h2 { margin: 0; color: #a4893d; font-size: 1.8rem; }
    .nav-btn { background: none; border: 2px solid #eee; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-family: 'Poppins'; font-weight: 600; color: #555; transition: 0.3s; }
    .nav-btn:hover { background: #f5f5f5; border-color: #ddd; }
    
    .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: 600; color: #888; margin-bottom: 10px; }
    .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
    .day-cell { min-height: 100px; border: 1px solid #eee; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 5px; }
    .day-cell.empty { background: #fcfcfc; border-color: transparent; }
    .day-number { font-weight: 600; color: #333; margin-bottom: 5px; }
    .day-cell.today .day-number { background: linear-gradient(120deg, #ff3a22, #c7af6b); color: #fff; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
    
    .event-badge { background: #e3f2fd; color: #1565c0; font-size: 0.75rem; padding: 4px 8px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; transition: 0.2s; border-left: 3px solid #1565c0; }
    .event-badge:hover { filter: brightness(0.95); }
    .cat-technical { background: #e8f4fd; color: #1565c0; border-left-color: #1565c0; }
    .cat-cultural   { background: #fce4ec; color: #c62828; border-left-color: #c62828; }
    .cat-sports     { background: #e8f5e9; color: #2e7d32; border-left-color: #2e7d32; }
    .cat-academic   { background: #ede7f6; color: #4527a0; border-left-color: #4527a0; }
    .cat-workshop   { background: #fff3e0; color: #e65100; border-left-color: #e65100; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">IIT Palakkad Dashboard</div>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="newclubs.html">Clubs</a></li>
      <li><a href="events.html">Events</a></li>
      <li><a href="images.html">Images</a></li>
      <li><a href="calendar.html" class="active">Calendar</a></li>
    </ul>
  </nav>

  <div class="calendar-container">
    <div class="calendar-header">
      <button class="nav-btn" id="prevMonth">&lt; Prev</button>
      <h2 id="monthYear">Loading...</h2>
      <button class="nav-btn" id="nextMonth">Next &gt;</button>
    </div>
    
    <div class="weekdays">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>
    <div class="days-grid" id="daysGrid">
      <!-- Days populated via JS -->
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    let currentDate = new Date();
    let eventsData = [];

    document.addEventListener('DOMContentLoaded', async () => {
      displayUserInfo();
      try {
        const data = await apiRequest('/events');
        eventsData = data.events;
      } catch (err) {
        console.error("Failed to load events", err);
      }
      renderCalendar();
    });

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      
      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      document.getElementById('monthYear').textContent = `${monthNames[month]} ${year}`;
      
      const grid = document.getElementById('daysGrid');
      grid.innerHTML = '';
      
      const today = new Date();
      
      // Empty cells for days before the 1st
      for (let i = 0; i < firstDay; i++) {
        grid.innerHTML += `<div class="day-cell empty"></div>`;
      }
      
      // Cells for days of the month
      for (let i = 1; i <= daysInMonth; i++) {
        const cellDate = new Date(year, month, i);
        const isToday = i === today.getDate() && month === today.getMonth() && year === today.getFullYear();
        
        // Find events for this day
        const dayEvents = eventsData.filter(ev => {
          const evDate = new Date(ev.date);
          return evDate.getDate() === i && evDate.getMonth() === month && evDate.getFullYear() === year;
        });
        
        let eventsHtml = dayEvents.map(ev => `
          <div class="event-badge cat-${ev.category}" title="${ev.title}" onclick="window.location.href='events.html'">
            ${ev.time} - ${ev.title}
          </div>
        `).join('');

        grid.innerHTML += `
          <div class="day-cell ${isToday ? 'today' : ''}">
            <div class="day-number">${i}</div>
            ${eventsHtml}
          </div>
        `;
      }
    }

    document.getElementById('prevMonth').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    document.getElementById('nextMonth').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });
  </script>
</body>
</html>
