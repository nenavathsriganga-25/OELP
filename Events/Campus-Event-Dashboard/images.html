<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | IIT Palakkad Campus</title>
  <link rel="stylesheet" href="style.css">

  <style>
    
    .arrow {
      position: absolute;
      top: 50%;
      font-size: 45px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      padding: 10px;
      transform: translateY(-50%);
      user-select: none;
      transition: 0.3s;
    }

    .arrow:hover {
      color: #ff3a22;
    }

    .arrow.left { left: 30px; }
    .arrow.right { right: 30px; }
  </style>

</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="logo">IIT Palakkad Dashboard</div>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="newclubs.html">Clubs</a></li>
      <li><a href="events.html">Events</a></li>
      <li><a href="images.html" class="active">Images</a></li>
      <li><a href="calendar.html">Calendar</a></li>
    </ul>
  </nav>

  <!-- HEADER -->
  <header class="page-header redgold-header">
    <h1>Gallery</h1>
    <a href="index.html" class="back-btn">← Back to Home</a>
  </header>

  <!-- GALLERY -->
  <main class="gallery-grid">
    <img src="https://jtazbldrflccroyjskuy.supabase.co/storage/v1/object/public/gallery-images/basket_ball_1758563391571_1.jpg" alt="Basketball Event">
    <img src="https://jtazbldrflccroyjskuy.supabase.co/storage/v1/object/public/gallery-images/volleyball_1758562938103_3.jpg" alt="Volleyball Event">
    <img src="https://jtazbldrflccroyjskuy.supabase.co/storage/v1/object/public/gallery-images/cricket_1758563280187_2.jpg" alt="Cricket Event">
    <img src="https://jtazbldrflccroyjskuy.supabase.co/storage/v1/object/public/gallery-images/football_1758563074140_1.jpg" alt="Football Event">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSGLfVf_So6ZjpMjdtpvkhOzXEHqSeZYee0-w&s" alt="Event">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRjXzdkS35HQH5GsRtI1fwMW8iPE8lT4WRIbw&s" alt="Event">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQLgcvF2imcnoZz_utvjik2EwkIEuSOxs_s3A&s" alt="Event">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQUVYQjSo5BxFp0wLRf2ORtXolBz96hYzAqkQ&s" alt="Event">
    <img src="https://iitpkd.ac.in/sites/default/files/styles/width_scale/public/2025-03/GC%202025.jpg?itok=3bin2y1f" alt="GC 2025">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRGRMrjiSaHwqgUrZ-PsUuZ3KuKFO9SS4TV1w&s" alt="Event">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcScyVqkSemrLaCevIXsCkAcnI-vJjD9LyGmzg&s" alt="Event">
    <img src="https://i.ytimg.com/vi/TVDlAFqyyDc/hqdefault.jpg" alt="Event">
  </main>

  <!-- LIGHTBOX -->
  <div id="lightbox">
    <span class="close">&times;</span>
    <span class="arrow left">&#10094;</span>
    <img id="lightbox-img" src="" alt="">
    <span class="arrow right">&#10095;</span>
  </div>

  <!-- JAVASCRIPT -->
  <script>
    const galleryImages = document.querySelectorAll('.gallery-grid img');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const closeBtn = document.querySelector('#lightbox .close');
    const nextBtn = document.querySelector('.arrow.right');
    const prevBtn = document.querySelector('.arrow.left');

    let currentIndex = 0;

    galleryImages.forEach((img, index) => {
      img.addEventListener('click', () => {
        currentIndex = index;
        showImage();
      });
    });

    function showImage() {
      lightbox.style.display = 'flex';
      lightboxImg.src = galleryImages[currentIndex].src;
    }

    nextBtn.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % galleryImages.length;
      showImage();
    });

    prevBtn.addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + galleryImages.length) % galleryImages.length;
      showImage();
    });

    closeBtn.addEventListener('click', () => {
      lightbox.style.display = 'none';
    });

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) lightbox.style.display = 'none';
    });

    document.addEventListener('keydown', (e) => {
      if (lightbox.style.display === "flex") {
        if (e.key === "ArrowRight") nextBtn.click();
        if (e.key === "ArrowLeft") prevBtn.click();
        if (e.key === "Escape") lightbox.style.display = 'none';
      }
    });

    let startX = 0;

    lightbox.addEventListener("touchstart", (e) => {
      startX = e.touches[0].clientX;
    });

    lightbox.addEventListener("touchend", (e) => {
      let endX = e.changedTouches[0].clientX;
      let diff = startX - endX;

      if (Math.abs(diff) > 50) { 
        if (diff > 0) {
          // Swipe Left → Next image
          currentIndex = (currentIndex + 1) % galleryImages.length;
        } else {
          // Swipe Right → Previous image
          currentIndex = (currentIndex - 1 + galleryImages.length) % galleryImages.length;
        }
        showImage();
      }
    });

  </script>

</body>
</html>
