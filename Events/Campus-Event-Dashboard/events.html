<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Events | IIT Palakkad</title>
  <meta name="description" content="Browse and register for all campus events at IIT Palakkad.">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .events-hero { background: linear-gradient(135deg,#1a0a00,#2d1200); padding: 70px 40px 50px; text-align: center; }
    .events-hero h1 { font-size: 2.8rem; color: #fff; font-weight: 700; }
    .events-hero h1 span { background: linear-gradient(120deg,#ff3a22,#c7af6b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .events-hero p { color: rgba(255,255,255,0.6); margin-top: 10px; font-size: 1rem; }

    .events-toolbar {
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
      max-width: 1100px; margin: 30px auto 0; padding: 0 24px;
    }
    .search-box {
      flex: 1; min-width: 220px; display: flex; align-items: center;
      background: #fff; border: 2px solid #e8e8e8; border-radius: 12px; padding: 0 16px; gap: 10px;
    }
    .search-box input { border: none; outline: none; font-family: 'Poppins',sans-serif; font-size: 0.95rem; width: 100%; padding: 12px 0; }
    .search-box span { color: #aaa; font-size: 1.1rem; }

    .filter-select {
      padding: 13px 16px; border: 2px solid #e8e8e8; border-radius: 12px; font-family: 'Poppins',sans-serif;
      font-size: 0.9rem; outline: none; background: #fff; cursor: pointer; transition: border-color 0.3s;
    }
    .filter-select:focus { border-color: #c7af6b; }

    .create-event-btn {
      padding: 13px 22px; background: linear-gradient(120deg,#ff3a22,#c7af6b); color: #fff;
      border: none; border-radius: 12px; font-family: 'Poppins',sans-serif; font-size: 0.9rem;
      font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(255,58,34,0.3); display: none; white-space: nowrap;
    }
    .create-event-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,58,34,0.4); }

    .events-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(320px,1fr));
      gap: 24px; max-width: 1100px; margin: 30px auto; padding: 0 24px 60px;
    }

    .event-card {
      background: #fff; border-radius: 16px; overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.07); transition: all 0.3s; border: 1px solid #f0f0f0;
    }
    .event-card:hover { transform: translateY(-6px); box-shadow: 0 12px 40px rgba(0,0,0,0.12); }

    .event-card-img { width: 100%; height: 180px; object-fit: cover; background: #f5f5f5; display: block; }
    .event-card-img-placeholder { width: 100%; height: 180px; background: linear-gradient(135deg,#1a0a00,#2d1200); display: flex; align-items: center; justify-content: center; font-size: 3rem; }

    .event-card-body { padding: 20px; }
    .event-card-cat {
      display: inline-block; padding: 3px 12px; border-radius: 20px; font-size: 0.72rem;
      font-weight: 600; text-transform: uppercase; margin-bottom: 10px;
    }
    .cat-technical { background: #e8f4fd; color: #1565c0; }
    .cat-cultural   { background: #fce4ec; color: #c62828; }
    .cat-sports     { background: #e8f5e9; color: #2e7d32; }
    .cat-academic   { background: #ede7f6; color: #4527a0; }
    .cat-workshop   { background: #fff3e0; color: #e65100; }
    .cat-other      { background: #f5f5f5; color: #555; }

    .event-card-title { font-size: 1.15rem; font-weight: 700; color: #1a1a1a; margin-bottom: 8px; }
    .event-card-meta { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
    .meta-row { font-size: 0.82rem; color: #888; display: flex; align-items: center; gap: 6px; }
    .meta-row strong { color: #555; }

    .event-card-actions { display: flex; gap: 10px; }
    .btn-detail {
      flex: 1; padding: 10px; border: 2px solid #e8e8e8; border-radius: 10px; background: none;
      font-family: 'Poppins',sans-serif; font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: all 0.2s; color: #555;
    }
    .btn-detail:hover { border-color: #c7af6b; color: #a4893d; }
    .btn-register {
      flex: 1; padding: 10px; background: linear-gradient(120deg,#ff3a22,#c7af6b); color: #fff;
      border: none; border-radius: 10px; font-family: 'Poppins',sans-serif; font-size: 0.85rem;
      font-weight: 600; cursor: pointer; transition: all 0.3s;
    }
    .btn-register:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-register.registered { background: #e8f5e9; color: #2e7d32; border: 2px solid #c3e6cb; }
    .btn-register.registered:hover { transform: none; }

    .status-badge {
      display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; margin-left: 8px;
    }
    .status-pending  { background: #fff3e0; color: #e65100; }
    .status-approved { background: #e8f5e9; color: #2e7d32; }
    .status-rejected { background: #fce4ec; color: #c62828; }

    .empty-state { text-align: center; padding: 80px 20px; grid-column: 1/-1; }
    .empty-state .icon { font-size: 4rem; margin-bottom: 16px; }
    .empty-state h3 { color: #333; font-size: 1.3rem; margin-bottom: 8px; }
    .empty-state p { color: #888; font-size: 0.95rem; }

    .loading-grid { grid-column: 1/-1; display: grid; grid-template-columns: repeat(auto-fill,minmax(320px,1fr)); gap: 24px; }
    .skeleton { background: #f0f0f0; border-radius: 16px; height: 320px; animation: shimmer 1.5s infinite; }
    @keyframes shimmer { 0%{opacity:1} 50%{opacity:0.5} 100%{opacity:1} }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px); padding: 20px; }
    .modal-overlay.open { display: flex; }
    .modal-box { background: #fff; border-radius: 20px; max-width: 680px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.25); animation: slideUp 0.3s ease; }
    @keyframes slideUp { from{transform:translateY(30px);opacity:0} to{transform:translateY(0);opacity:1} }
    .modal-img { width: 100%; height: 260px; object-fit: cover; border-radius: 20px 20px 0 0; }
    .modal-img-placeholder { width: 100%; height: 200px; background: linear-gradient(135deg,#1a0a00,#2d1200); border-radius: 20px 20px 0 0; display: flex; align-items: center; justify-content: center; font-size: 5rem; }
    .modal-body { padding: 30px; }
    .modal-title { font-size: 1.7rem; font-weight: 700; color: #1a1a1a; margin-bottom: 16px; }
    .modal-meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 2px solid #f0f0f0; }
    .modal-meta-item { display: flex; flex-direction: column; gap: 3px; }
    .modal-meta-label { font-size: 0.72rem; text-transform: uppercase; color: #aaa; font-weight: 600; letter-spacing: 0.5px; }
    .modal-meta-val { font-size: 0.9rem; color: #333; font-weight: 500; }
    .modal-section-title { font-size: 1rem; font-weight: 600; color: #a4893d; margin-bottom: 8px; }
    .modal-section p { font-size: 0.9rem; color: #555; line-height: 1.8; }
    .modal-actions { display: flex; gap: 12px; margin-top: 24px; }
    .modal-close-btn { position: absolute; top: 16px; right: 16px; background: rgba(0,0,0,0.4); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; z-index: 10; }
    .modal-box { position: relative; }

    @media (max-width: 600px) {
      .events-hero h1 { font-size: 2rem; }
      .modal-meta-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">IIT Palakkad Dashboard</div>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="newclubs.html">Clubs</a></li>
      <li><a href="gc.html">GC 2026</a></li>
      <li><a href="events.html" class="active">Events</a></li>
      <li><a href="images.html">Images</a></li>
      <li><a href="calendar.html">Calendar</a></li>
    </ul>
  </nav>

  <header class="events-hero">
    <h1>Campus <span>Events</span></h1>
    <p>Discover, register, and participate in the best campus events</p>
  </header>

  <div class="events-toolbar">
    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="Search events...">
    </div>
    <select class="filter-select" id="categoryFilter">
      <option value="all">All Categories</option>
      <option value="technical">Technical</option>
      <option value="cultural">Cultural</option>
      <option value="sports">Sports</option>
      <option value="academic">Academic</option>
      <option value="workshop">Workshop</option>
      <option value="other">Other</option>
    </select>
    <a href="create-event.html" class="create-event-btn" id="createEventBtn">+ Create Event</a>
  </div>

  <div class="events-grid" id="eventsGrid">
    <div class="loading-grid">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
  </div>

  <!-- Event Detail Modal -->
  <div class="modal-overlay" id="eventModal">
    <div class="modal-box" id="modalBox">
      <button class="modal-close-btn" id="modalClose">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    const API = 'http://localhost:5001/api';
    let myRegistrations = new Set();
    let allEvents = [];

    document.addEventListener('DOMContentLoaded', async () => {
      displayUserInfo();
      const user = getCurrentUser();

      // Show create button for organizer/admin
      if (user && (user.role === 'organizer' || user.role === 'admin')) {
        document.getElementById('createEventBtn').style.display = 'block';
      }

      await loadMyRegistrations();
      await loadEvents();

      document.getElementById('searchInput').addEventListener('input', filterEvents);
      document.getElementById('categoryFilter').addEventListener('change', filterEvents);
    });

    async function loadMyRegistrations() {
      try {
        const data = await apiRequest('/registrations/my');
        data.registrations.forEach(r => { if (r.event) myRegistrations.add(r.event._id); });
      } catch {}
    }

    async function loadEvents() {
      try {
        const data = await apiRequest('/events');
        allEvents = data.events;
        renderEvents(allEvents);
      } catch (err) {
        document.getElementById('eventsGrid').innerHTML = `
          <div class="empty-state">
            <div class="icon">⚠️</div>
            <h3>Could not load events</h3>
            <p>${err.message}</p>
          </div>`;
      }
    }

    function filterEvents() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const cat = document.getElementById('categoryFilter').value;
      const filtered = allEvents.filter(e => {
        const matchSearch = e.title.toLowerCase().includes(search) || e.description.toLowerCase().includes(search);
        const matchCat = cat === 'all' || e.category === cat;
        return matchSearch && matchCat;
      });
      renderEvents(filtered);
    }

    function renderEvents(events) {
      const grid = document.getElementById('eventsGrid');
      if (!events.length) {
        grid.innerHTML = `<div class="empty-state"><div class="icon">📭</div><h3>No events found</h3><p>Try adjusting your search or filters.</p></div>`;
        return;
      }
      const user = getCurrentUser();
      grid.innerHTML = events.map(ev => {
        const isRegistered = myRegistrations.has(ev._id);
        const catClass = `cat-${ev.category}`;
        const dateStr = new Date(ev.date).toLocaleDateString('en-IN', { weekday:'short', day:'numeric', month:'short', year:'numeric' });
        const deadline = new Date(ev.registrationDeadline);
        const deadlinePassed = new Date() > deadline;
        const isFull = ev.participants.length >= ev.maxParticipants;
        const canRegister = !deadlinePassed && !isFull && ev.status === 'approved';

        let regBtnHtml = '';
        if (ev.status === 'approved') {
          if (isRegistered) {
            regBtnHtml = `<button class="btn-register registered" onclick="cancelReg('${ev._id}',this)">✓ Registered</button>`;
          } else if (!canRegister) {
            regBtnHtml = `<button class="btn-register" disabled style="opacity:0.5;cursor:not-allowed">${deadlinePassed ? 'Deadline Passed' : 'Full'}</button>`;
          } else {
            regBtnHtml = `<button class="btn-register" onclick="registerEvent('${ev._id}',this)">Register →</button>`;
          }
        }

        const statusBadge = (user && (user.role === 'admin' || (user.role === 'organizer' && ev.organizer && ev.organizer._id === user.id)))
          ? `<span class="status-badge status-${ev.status}">${ev.status}</span>` : '';

        return `
          <div class="event-card">
            ${ev.image ? `<img class="event-card-img" src="${ev.image}" alt="${ev.title}" onerror="this.style.display='none'">` : `<div class="event-card-img-placeholder">🎯</div>`}
            <div class="event-card-body">
              <span class="event-card-cat ${catClass}">${ev.category}</span>${statusBadge}
              <div class="event-card-title">${ev.title}</div>
              <div class="event-card-meta">
                <div class="meta-row">📅 <strong>${dateStr}</strong></div>
                <div class="meta-row">⏰ ${ev.time}</div>
                <div class="meta-row">📍 ${ev.venue}</div>
                <div class="meta-row">👥 ${ev.participants.length}/${ev.maxParticipants} registered</div>
              </div>
              <div class="event-card-actions">
                <button class="btn-detail" onclick="openModal('${ev._id}')">View Details</button>
                ${regBtnHtml}
              </div>
            </div>
          </div>`;
      }).join('');
    }

    async function registerEvent(id, btn) {
      btn.disabled = true; btn.textContent = 'Registering...';
      try {
        await apiRequest(`/registrations/${id}`, 'POST');
        myRegistrations.add(id);
        filterEvents();
      } catch (err) { alert(err.message); btn.disabled = false; btn.textContent = 'Register →'; }
    }

    async function cancelReg(id, btn) {
      if (!confirm('Cancel your registration for this event?')) return;
      btn.disabled = true;
      try {
        await apiRequest(`/registrations/${id}`, 'DELETE');
        myRegistrations.delete(id);
        filterEvents();
      } catch (err) { alert(err.message); btn.disabled = false; }
    }

    // Modal
    const modal = document.getElementById('eventModal');
    document.getElementById('modalClose').addEventListener('click', () => modal.classList.remove('open'));
    modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });

    async function openModal(id) {
      modal.classList.add('open');
      document.getElementById('modalContent').innerHTML = '<div style="padding:60px;text-align:center;color:#aaa;">Loading...</div>';
      try {
        const data = await apiRequest(`/events/${id}`);
        const ev = data.event;
        const dateStr = new Date(ev.date).toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
        const deadline = new Date(ev.registrationDeadline).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
        document.getElementById('modalContent').innerHTML = `
          ${ev.image ? `<img class="modal-img" src="${ev.image}" alt="${ev.title}">` : `<div class="modal-img-placeholder">🎯</div>`}
          <div class="modal-body">
            <span class="event-card-cat cat-${ev.category}" style="margin-bottom:12px;display:inline-block;">${ev.category}</span>
            <div class="modal-title">${ev.title}</div>
            <div class="modal-meta-grid">
              <div class="modal-meta-item"><div class="modal-meta-label">Date</div><div class="modal-meta-val">📅 ${dateStr}</div></div>
              <div class="modal-meta-item"><div class="modal-meta-label">Time</div><div class="modal-meta-val">⏰ ${ev.time}</div></div>
              <div class="modal-meta-item"><div class="modal-meta-label">Venue</div><div class="modal-meta-val">📍 ${ev.venue}</div></div>
              <div class="modal-meta-item"><div class="modal-meta-label">Organizer</div><div class="modal-meta-val">👤 ${ev.organizer?.fullName || 'Admin'}</div></div>
              <div class="modal-meta-item"><div class="modal-meta-label">Registration Deadline</div><div class="modal-meta-val">🗓 ${deadline}</div></div>
              <div class="modal-meta-item"><div class="modal-meta-label">Participants</div><div class="modal-meta-val">👥 ${ev.participants.length} / ${ev.maxParticipants}</div></div>
            </div>
            <div class="modal-section" style="margin-bottom:20px;">
              <div class="modal-section-title">About this Event</div>
              <p>${ev.description}</p>
            </div>
            ${ev.agenda ? `<div class="modal-section" style="margin-bottom:20px;"><div class="modal-section-title">Agenda</div><p>${ev.agenda}</p></div>` : ''}
            <div class="modal-actions">
              ${ev.contact ? `<a href="mailto:${ev.contact}" style="padding:12px 20px;background:#f5f5f5;border-radius:10px;text-decoration:none;color:#333;font-size:0.9rem;">📧 Contact</a>` : ''}
              ${ev.instagram ? `<a href="${ev.instagram}" target="_blank" style="padding:12px 20px;background:#f5f5f5;border-radius:10px;text-decoration:none;color:#333;font-size:0.9rem;">📸 Instagram</a>` : ''}
            </div>
          </div>`;
      } catch (err) { document.getElementById('modalContent').innerHTML = `<div style="padding:60px;text-align:center;color:#d32f2f;">${err.message}</div>`; }
    }
  </script>
</body>
</html>
